<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axios & 防抖节流 Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #result,
        #postResult,
        #asyncGetResult,
        #asyncPostResult {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 300px;
            padding: 8px;
        }

        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background-color: #45a049;
        }

        hr {
            margin: 30px 0;
            border: 0;
            border-top: 1px solid #eee;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .method-title {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Axios GET Request Example</h1>
    <button id="fetchButton">Fetch Users</button>
    <div id="result"></div>

    <!-- POST 请求示例 -->
    <hr>
    <h1>Axios POST Request Example</h1>
    <div class="form-group">
        <label for="titleInput">标题:</label>
        <input type="text" id="titleInput" placeholder="输入标题">
    </div>
    <div class="form-group">
        <label for="bodyInput">内容:</label>
        <input type="text" id="bodyInput" placeholder="输入内容">
    </div>
    <button id="postButton">提交数据</button>
    <div id="postResult"></div>

    <!-- Async/Await GET 请求示例 -->
    <hr>
    <h1>Axios <span class="method-title">Async/Await</span> GET Request Example</h1>
    <button id="asyncFetchButton">Async 获取用户</button>
    <div id="asyncGetResult"></div>

    <!-- Async/Await POST 请求示例 -->
    <hr>
    <h1>Axios <span class="method-title">Async/Await</span> POST Request Example</h1>
    <div class="form-group">
        <label for="asyncTitleInput">标题:</label>
        <input type="text" id="asyncTitleInput" placeholder="输入标题">
    </div>
    <div class="form-group">
        <label for="asyncBodyInput">内容:</label>
        <input type="text" id="asyncBodyInput" placeholder="输入内容">
    </div>
    <button id="asyncPostButton">Async 提交数据</button>
    <div id="asyncPostResult"></div>

    <!-- 引入 Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        // ---------------- 防抖与节流函数定义 ----------------
        function debounce(func, delay) {
            let timer;
            return function() {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    func.apply(this, arguments);
                }, delay);
            }
        }

        function throttle(func, delay) {
            let lastTime = 0;
            return function() {
                const now = Date.now();
                if (now - lastTime >= delay) {
                    func.apply(this, arguments);
                    lastTime = now;
                }
            }
        }

        // --- 带防抖的 Axios GET 请求 ---
        document.getElementById("fetchButton").addEventListener('click', debounce(function () {
            axios.get("https://s5.360game.360.cn/to5/mini/v21/category.html")
            .then(function (response) {
                console.log(response, '++++++++++++++++++++++++++++++++++++');
                const users = response.data.data;
                console.log(users, '------------------------------------');
                const resultDiv = document.getElementById("result");
                resultDiv.innerHTML = '<h2>Users Found:</h2>' + users.map(user =>
                    `<li>${user.name}</li>`).join('');
            }).catch(function(error){
                console.log(error, 'erererererererererererererer+');
            })
        }, 1000));

        // --- 带节流的 Axios POST 请求 ---
        document.getElementById('postButton').addEventListener('click', throttle(function() {
            const title = document.getElementById('titleInput').value || '默认标题';
            const body = document.getElementById('bodyInput').value || '默认内容';
            const postData = {
                title: title,
                body: body,
                userId: 1
            };

            axios.post('https://jsonplaceholder.typicode.com/posts', postData)
            .then(function (response) {
                console.log('post成功++++++++++++', response.data);
                const postResultDiv = document.getElementById('postResult');
                postResultDiv.innerHTML = 
                    `<h3>Post结果</h3>
                    <p><strong>响应状态：</strong>${response.status}</p>
                    <p><strong>返回ID：</strong>${response.data.id}</p>
                    <p><strong>标题：</strong>${response.data.title}</p>
                    <p><strong>内容：</strong>${response.data.body}</p>`;
            }).catch(function (error) {
                console.error('post失败++++++++++++', error);
                document.getElementById('postResult').innerHTML = 
                    `<p>提交数据时出错</p><p><strong>错误信息：</strong>${error}</p>`;
            });
        }, 2000));

        // --- 带防抖的 Async/Await GET 请求 ---
        document.getElementById('asyncFetchButton').addEventListener('click', debounce(async function () {
            try {
                const response = await axios.get(
                    'https://s5.360game.360.cn/to5/mini/v21/category.html');
                console.log(response, 'asyncrerererer+-------------------');
                const gkeys = response.data.data;
                console.log(gkeys, '99999999999999999999999');
                const resultDiv = document.getElementById('asyncGetResult');
                resultDiv.innerHTML = '<h2>Users Gkey Found:</h2><ul>' + gkeys.map(gkey =>
                    `<li>${gkey.name}</li>`).join('') + '</ul>';
            } catch (error) {
                console.error('get请求失败:', error);
                document.getElementById('asyncGetResult').innerHTML =
                    `<p>获取数据时出错</p><p><strong>错误信息</strong>: ${error.message}</p>`;
            }
        }, 1000));

        // --- 带节流的 Async/Await POST 请求 ---
        document.getElementById('asyncPostButton').addEventListener('click', throttle(async function () {
            try {
                const title = document.getElementById('asyncTitleInput').value || '默认标题';
                const body = document.getElementById('asyncBodyInput').value || '默认内容';

                const postData = {
                    title: title,
                    body: body,
                    userId: 2
                }

                const response = await axios.post('https://jsonplaceholder.typicode.com/posts',
                    postData);
                console.log("async post成功-/-/-/-/-/-/-/-/-", response.data);
                const postResultDiv = document.getElementById('asyncPostResult');
                postResultDiv.innerHTML =
                    `<h3>Post结果</h3>
                    <p><strong>响应状态：</strong>${response.status}</p>
                    <p><strong>响应id：</strong>${response.data.id}</p>
                    <p><strong>响应title：</strong>${response.data.title}</p>
                    <p><strong>响应body：</strong>${response.data.body}</p>`;
            } catch (error) {
                console.error('post请求失败:', error);
                document.getElementById('asyncPostResult').innerHTML =
                    `<p>提交数据时出错</p><p><strong>错误信息</strong>: ${error.message}</p>`;
            }
        }, 2000));

    </script>
</body>

</html>
